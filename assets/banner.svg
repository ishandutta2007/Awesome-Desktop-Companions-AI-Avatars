<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1035"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="subGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient><linearGradient id="cyanOrb" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0"/></linearGradient><linearGradient id="purpleOrb" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#c084fc" stop-opacity=".3"/><stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/></linearGradient><linearGradient id="pinkOrb" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f43f5e" stop-opacity=".2"/><stop offset="100%" stop-color="#9f1239" stop-opacity="0"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".9"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".35" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowOrb" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="50"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes orbitFlow{0%{stroke-dashoffset:800}}.anim-float1{animation:floatSlow 7s ease-in-out infinite}.anim-float2{animation:floatReverse 8s ease-in-out infinite}.anim-pulse{animation:pulseGlow 5s ease-in-out infinite}.anim-flow{stroke-dasharray:20 15;animation:orbitFlow 25s linear infinite}.badge-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800}.sub-text{font-weight:400}.badge-text{font-weight:600;font-size:13px}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#techGrid)" rx="16"/><circle cx="200" cy="120" r="160" fill="url(#cyanOrb)" class="anim-pulse" filter="url(#glowOrb)"/><circle cx="1020" cy="240" r="180" fill="url(#purpleOrb)" class="anim-pulse" filter="url(#glowOrb)" style="animation-delay:-2s"/><circle cx="600" cy="360" r="150" fill="url(#pinkOrb)" class="anim-pulse" filter="url(#glowOrb)" style="animation-delay:-3.5s"/><path fill="none" stroke="url(#textGrad)" stroke-opacity=".4" stroke-width="2.5" d="M -50,280 C 300,180 450,380 850,220 C 1050,140 1150,280 1250,240" class="anim-flow"/><path fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1.5" d="M -30,120 C 350,260 650,80 950,290 C 1100,380 1200,320 1250,310" class="anim-flow" style="animation-duration:35s;animation-direction:reverse"/><g class="anim-float1"><g transform="translate(80, 50)"><rect width="145" height="34" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" filter="url(#glow)" rx="17"/><text x="72" y="22" fill="#38bdf8" class="badge-text"