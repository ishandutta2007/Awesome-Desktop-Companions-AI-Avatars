<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cyanOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="purpleOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pinkOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowOrb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-float1 { animation: floatSlow 7s ease-in-out infinite; }
      .anim-float2 { animation: floatReverse 8s ease-in-out infinite; }
      .anim-pulse { animation: pulseGlow 5s ease-in-out infinite; }
      .anim-flow { stroke-dasharray: 20 15; animation: orbitFlow 25s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#techGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="120" r="160" fill="url(#cyanOrb)" filter="url(#glowOrb)" class="anim-pulse" />
  <circle cx="1020" cy="240" r="180" fill="url(#purpleOrb)" filter="url(#glowOrb)" class="anim-pulse" style="animation-delay: -2s;" />
  <circle cx="600" cy="360" r="150" fill="url(#pinkOrb)" filter="url(#glowOrb)" class="anim-pulse" style="animation-delay: -3.5s;" />

  <!-- Animated Dynamic Flow Lines in Background -->
  <path d="M -50,280 C 300,180 450,380 850,220 C 1050,140 1150,280 1250,240" fill="none" stroke="url(#textGrad)" stroke-width="2.5" stroke-opacity="0.4" class="anim-flow" />
  <path d="M -30,120 C 350,260 650,80 950,290 C 1100,380 1200,320 1250,310" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" class="anim-flow" style="animation-duration: 35s; animation-direction: reverse;" />

  <!-- Floating Dynamic Feature Chips (Background Accents) -->
  <g class="anim-float1">
    <g transform="translate(80, 50)">
      <rect width="145" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <text x="72" y="22" fill="#38bdf8" text-anchor="middle" class="badge-text">✨ 3D VRM Avatars</text>
    </g>
  </g>

  <g class="anim-float2">
    <g transform="translate(970, 65)">
      <rect width="155" height="34" rx="17" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <text x="77" y="22" fill="#e879f9" text-anchor="middle" class="badge-text">🎭 Live2D Lip-Sync</text>
    </g>
  </g>

  <g class="anim-float1" style="animation-delay: -3s;">
    <g transform="translate(70, 320)">
      <rect width="165" height="34" rx="17" fill="url(#pillGrad1)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.5" filter="url(#glow)" />
      <text x="82" y="22" fill="#fb7185" text-anchor="middle" class="badge-text">👾 Desktop Mascots</text>
    </g>
  </g>

  <g class="anim-float2" style="animation-delay: -4s;">
    <g transform="translate(965, 315)">
      <rect width="160" height="34" rx="17" fill="url(#pillGrad1)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <text x="80" y="22" fill="#34d399" text-anchor="middle" class="badge-text">🧠 Local Memory AI</text>
    </g>
  </g>

  <!-- Foreground Clear Content (Guaranteed Never Hidden) -->
  <!-- Top Category Eyebrow -->
  <g transform="translate(600, 95)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#475569" stroke-width="1" />
    <text x="0" y="5" fill="#38bdf8" text-anchor="middle" class="badge-text" letter-spacing="1.5">🚀 CURATED DIRECTORY &amp; ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="175" text-anchor="middle" fill="url(#textGrad)" class="title-text" font-size="44" letter-spacing="-0.5">Desktop Companions &amp; AI Avatars</text>

  <!-- Subtitle -->
  <text x="600" y="220" text-anchor="middle" fill="url(#subGrad)" class="sub-text" font-size="20">Interactive 3D VRM &amp; Live2D Mascots • Self-Hosted Agents • Companion SaaS</text>

  <!-- Tagline / Value Proposition -->
  <text x="600" y="255" text-anchor="middle" fill="#64748b" class="sub-text" font-size="15">Empowering developers &amp; creators with autonomous, expressive, and local-first synthetic personas</text>

  <!-- Feature Highlights Row -->
  <g transform="translate(600, 290)">
    <rect x="-260" y="0" width="120" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="-200" y="18" fill="#94a3b8" text-anchor="middle" class="badge-text" font-size="12">🎙️ Voice &amp; Vision</text>

    <rect x="-125" y="0" width="115" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="-68" y="18" fill="#94a3b8" text-anchor="middle" class="badge-text" font-size="12">🌐 Transparent UI</text>

    <rect x="5" y="0" width="120" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="65" y="18" fill="#94a3b8" text-anchor="middle" class="badge-text" font-size="12">🔒 Local-First AI</text>

    <rect x="140" y="0" width="120" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="200" y="18" fill="#94a3b8" text-anchor="middle" class="badge-text" font-size="12">⚡ 100% Open Data</text>
  </g>
</svg>
